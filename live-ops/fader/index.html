<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOTION fader</title>
<style>
  :root { --void: #0A0810; --bone: #EDE6DA; --red: #E23B3B; --dim: #2A2633; }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--bone);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  body { display: flex; flex-direction: column; padding: 28px; gap: 20px; }
  h1 { font-size: 15px; letter-spacing: 0.14em; font-weight: 600; margin: 0; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 88px; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 28px; background: var(--dim); border-radius: 14px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 72px; width: 72px; border-radius: 16px;
    background: var(--bone); margin-top: -22px;
  }
  button {
    min-height: 72px; border: 0; border-radius: 18px; font-size: 22px; font-weight: 600;
    background: var(--bone); color: var(--void);
  }
  button.on { background: var(--red); color: white; }
  #lim { font-size: 18px; min-height: 28px; }
</style>
</head>
<body>
  <h1>MASTER</h1>
  <input id="fader" type="range" min="0" max="100" value="70">
  <button id="mute" type="button">MUTE</button>
  <div id="lim"></div>
<script>
const $ = (id) => document.getElementById(id);
let muted = false;
const token = new URLSearchParams(location.search).get("token") || "";
const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.hostname + ":8767/" + (token ? ("?token=" + encodeURIComponent(token)) : "");
let sock;
function connect() {
  sock = new WebSocket(wsUrl);
  sock.onmessage = (ev) => {
    const s = JSON.parse(ev.data);
    $("lim").textContent = s.limiter ? "LIMITER" : "";
  };
  sock.onclose = () => setTimeout(connect, 1000);
}
function send() {
  if (sock && sock.readyState === 1) {
    sock.send(JSON.stringify({ gain: Number($("fader").value) / 100, mute: muted }));
  }
}
$("fader").addEventListener("input", send);
$("mute").onclick = () => {
  muted = !muted;
  $("mute").classList.toggle("on", muted);
  $("mute").textContent = muted ? "MUTED" : "MUTE";
  send();
};
connect();
</script>
</body>
</html>
