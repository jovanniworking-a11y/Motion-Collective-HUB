<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOTION live</title>
<style>
  :root {
    --void: #0A0810;
    --bone: #EDE6DA;
    --green: #3DDC97;
    --amber: #E6B15A;
    --red: #E23B3B;
    --dim: #2A2633;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--void); color: var(--bone);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body { display: flex; flex-direction: column; min-height: 100%; padding: 24px; gap: 16px; }
  .num {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 0.9;
  }
  #occ { font-size: clamp(96px, 28vw, 220px); }
  .sub { font-size: 28px; opacity: 0.85; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .tile {
    background: var(--dim); border-radius: 16px; padding: 16px 18px; min-width: 120px; min-height: 72px;
  }
  .tile b { display: block; font-size: 22px; font-weight: 600; }
  .tile span { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; }
  button {
    appearance: none; border: 0; border-radius: 18px;
    min-height: 64px; min-width: 100%;
    font-size: 22px; font-weight: 600; color: var(--void); background: var(--bone);
  }
  button:active { transform: scale(0.98); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--amber); }
  .dot.green { background: var(--green); }
  .dot.red { background: var(--red); }
  .dot.unknown { background: #665; }
  body.tone-green #occ { color: var(--green); }
  body.tone-amber #occ { color: var(--amber); }
  body.tone-red #occ { color: var(--red); }
  #hq { display: none; }
  body.view-hq #hq { display: block; }
  body.view-door #checkin { display: block; }
  #checkin { display: none; margin-top: auto; }
</style>
</head>
<body class="view-hq">
  <div class="sub" id="label">OCCUPANCY</div>
  <div class="num" id="occ">–</div>
  <div class="sub" id="space">SPACE LEFT –</div>
  <div class="row" id="hq">
    <div class="tile"><span>in</span><b id="ins">–</b></div>
    <div class="tile"><span>out</span><b id="outs">–</b></div>
    <div class="tile"><span>peak</span><b id="peak">–</b></div>
    <div class="tile"><span>camera</span><b id="cam"><i class="dot"></i>–</b></div>
    <div class="tile"><span>counter</span><b id="fps">–</b></div>
    <div class="tile"><span>djm</span><b id="djm"><i class="dot unknown"></i>–</b></div>
    <div class="tile"><span>projector</span><b id="proj"><i class="dot unknown"></i>–</b></div>
    <div class="tile"><span>recorder</span><b id="rec"><i class="dot unknown"></i>–</b></div>
  </div>
  <button id="checkin" type="button">CHECK IN</button>
<script>
const q = new URLSearchParams(location.search);
document.body.className = (q.get("view") === "door") ? "view-door" : "view-hq";
const $ = (id) => document.getElementById(id);
function tone(n) {
  if (n >= 65) return "tone-red";
  if (n >= 55) return "tone-amber";
  return "tone-green";
}
function dot(el, state) {
  el.innerHTML = '<i class="dot ' + state + '"></i>' + state;
}
function render(s) {
  document.body.classList.remove("tone-green", "tone-amber", "tone-red");
  document.body.classList.add(tone(s.occupancy));
  $("occ").textContent = s.occupancy + "/" + s.cap;
  const hold = s.occupancy >= s.cap;
  $("space").textContent = hold ? "Hold the door — at cap" : ("SPACE LEFT " + s.space_left);
  $("ins").textContent = s.ins;
  $("outs").textContent = s.outs;
  $("peak").textContent = s.peak;
  dot($("cam"), s.health.camera);
  $("fps").textContent = s.health.counter_fps + " fps";
  dot($("djm"), s.health.djm);
  dot($("proj"), s.health.projector);
  dot($("rec"), s.health.recorder);
}
const token = q.get("token") || "";
const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.hostname + ":8766/" + (token ? ("?token=" + encodeURIComponent(token)) : "");
let sock;
function connect() {
  sock = new WebSocket(wsUrl);
  sock.onmessage = (ev) => render(JSON.parse(ev.data));
  sock.onclose = () => setTimeout(connect, 1000);
}
connect();
$("checkin").onclick = () => {
  if (sock && sock.readyState === 1) sock.send(JSON.stringify({ action: "checkin" }));
};
</script>
</body>
</html>
