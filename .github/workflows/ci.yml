# @agent-provenance [2026-10-24T21:04:59Z] [agent:claude-code] [status:completed/verified_passed] [trace:tr_449ea655617b4567]
# @summary: Close the four provenance limits: shared leases, guest denylist, coverage gate, agent registry
# @handoff: Jovanni: set MOTION_AGENT_TOKEN on Vercel api + GitHub secrets MOTION_API_URL/MOTION_AGENT_TOKEN; optional GUEST_DENYLIST
name: CI

on:
  push:
    branches: [claude/motion-files-consolidated-dx17w2]
  pull_request:

permissions:
  contents: read

jobs:
  provenance-coverage:
    # Every file an agent branch changes needs a current stamp (enforced on agent branches, report-only otherwise).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/api/requirements.txt
      - name: coverage vs main
        env:
          GUEST_DENYLIST: ${{ secrets.GUEST_DENYLIST }}
        run: |
          git fetch -q origin main
          python orch/provenance/agent.py coverage --base origin/main
      - name: no denylisted guest names in this change (skipped when the secret is unset)
        env:
          GUEST_DENYLIST: ${{ secrets.GUEST_DENYLIST }}
        run: |
          [ -n "$GUEST_DENYLIST" ] || { echo "GUEST_DENYLIST secret not set; skipping"; exit 0; }
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "orch/provenance")
          from provenance import find_guest_names
          diff = subprocess.run(["git", "diff", "-U0", "origin/main...HEAD"], capture_output=True, text=True).stdout
          added = "\n".join(l[1:] for l in diff.splitlines() if l.startswith("+") and not l.startswith("+++"))
          hits = find_guest_names(added)
          print(f"{len(hits)} denylisted name(s) in added lines")
          sys.exit(1 if hits else 0)
          PY

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motion
          POSTGRES_PASSWORD: motion
          POSTGRES_DB: motion
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/api/requirements.txt
      - name: pytest (SQLite)
        run: python -m pytest -q services/api
      - name: agent provenance tests + ledger integrity
        run: pip install jsonschema && python -m pytest -q orch/provenance/tests && python orch/provenance/agent.py verify-chain
      - name: live-ops tests (counter, bridge, fader)
        run: pip install -r live-ops/requirements.txt && python -m pytest -q live-ops
      - name: Postgres role the data contract writes as
        env:
          PGPASSWORD: motion
        run: psql -h 127.0.0.1 -U motion -d motion -c "CREATE ROLE motion_api NOLOGIN; GRANT motion_api TO motion;"
      - name: pytest (Postgres)
        env:
          MOTION_TEST_DATABASE_URL: postgres://motion:motion@127.0.0.1:5432/motion
          MOTION_DATA_DIR: /tmp/motion-api-pg
        run: python -m pytest -q services/api

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ops-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/ops-panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx next lint
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
      - run: npm run test:e2e:auth
        env:
          CI: "1"
