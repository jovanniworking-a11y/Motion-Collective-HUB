name: CI

on:
  push:
    branches: [claude/motion-files-consolidated-dx17w2]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motion
          POSTGRES_PASSWORD: motion
          POSTGRES_DB: motion
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/api/requirements.txt
      - name: pytest (SQLite)
        run: python -m pytest -q services/api
      - name: pytest (Postgres)
        env:
          DATABASE_URL: postgres://motion:motion@127.0.0.1:5432/motion
          MOTION_DATA_DIR: /tmp/motion-api-pg
        run: python -m pytest -q services/api

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ops-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/ops-panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx next lint
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
      - run: npm run test:e2e:auth
        env:
          CI: "1"
