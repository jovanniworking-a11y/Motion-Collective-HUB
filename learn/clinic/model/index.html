<style>
/* Layout: the clay model fills the screen; a step rail runs along the top, a room card slides up from the bottom. */
:root {
  --bg: #e9eef6; --ink: #2b2f3a; --dim: #626a7c; --card: #ffffffee; --line: #d5dbe7; --accent: #6f5bd3; --accent-ink: #ffffff;
  --chip: #f1f3f9; --good: #2f8f5b; --warn: #b86a12;
  --display: "Fredoka", "Nunito", system-ui, sans-serif; --body: "Nunito", system-ui, -apple-system, Segoe UI, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d2130; --ink: #eef0f6; --dim: #a3abc0; --card: #262b3cee; --line: #3a4157; --accent: #9d8cf2; --accent-ink: #15121f; --chip: #31374b; --good: #6fd29b; --warn: #f0b25e; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #1d2130; --ink: #eef0f6; --dim: #a3abc0; --card: #262b3cee; --line: #3a4157; --accent: #9d8cf2; --accent-ink: #15121f; --chip: #31374b; --good: #6fd29b; --warn: #f0b25e; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; }
.top { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; pointer-events: none; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; pointer-events: auto; }
h1 { font: 600 clamp(20px, 4vw, 28px)/1.1 var(--display); margin: 0; }
.mode { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mode button { font: 600 14px var(--body); border: 0; background: none; color: var(--dim); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.play { font: 700 14px var(--body); border: 0; border-radius: 999px; padding: 9px 16px; background: var(--ink); color: var(--bg); cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.rail { display: flex; gap: 6px; overflow-x: auto; pointer-events: auto; padding-bottom: 4px; scrollbar-width: none; }
.rail button { flex: none; font: 600 13px var(--body); border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 7px 10px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.rail button .n { font: 600 12px var(--display); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); }
.rail button[aria-current="step"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.rail button[aria-current="step"] .n { background: var(--accent); color: var(--accent-ink); }
.card { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 18px 16px; display: grid; gap: 10px; box-shadow: 0 10px 30px #0002; backdrop-filter: blur(8px); }
.card h2 { font: 600 22px/1.15 var(--display); margin: 0; }
.card p { margin: 0; line-height: 1.45; font-size: 15px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 12px var(--body); background: var(--chip); border-radius: 999px; padding: 4px 10px; color: var(--ink); }
.chip.est::after { content: " · estimate"; color: var(--dim); font-weight: 400; }
.k { font: 700 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; }
.risk li::marker { color: var(--warn); }
.code { font-size: 14px; color: var(--good); font-weight: 700; }
.hint { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--dim); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
@media (max-width: 640px) { .hint { display: none; } .card { padding: 14px; } .card h2 { font-size: 19px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
<div id="stage" aria-label="Clay model of the clinic: rooms on a table, a team of clay cats, and a patient cat moving through them"></div>
<div class="top">
  <div class="head">
    <h1>Clinic Flow</h1>
    <div class="mode" role="group" aria-label="Which day">
      <button type="button" id="m-clinic" aria-pressed="true">Clinic day</button>
      <button type="button" id="m-proc" aria-pressed="false">Procedure day</button>

    <button type="button" class="play" id="play">▶ Play the visit</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---- the clinic: rooms, what happens there, and which Clinic Quest level automates it (times are estimates)
const ROOMS = {
  checkin:  { name: "Check-in desk", x: -6, z: 6, w: 4.2, d: 3.4, color: 0xff9a66, mins: "3–5 min",
    what: "Confirm identity, insurance card, forms and copay. The patient gets a time estimate.",
    who: "Monica · front office", risks: ["Forms not done before arrival", "Insurance changed since booking"], code: "L01 front desk · L02 patient cards" },
  waiting:  { name: "Waiting room", x: -6, z: 1, w: 4.2, d: 4.2, color: 0x74cf8a, mins: "under 15 min (goal)",
    what: "Short and calm. Pain patients sit badly for long, so the wait is the number to watch.",
    who: "Monica and Sydney keep an eye on it", risks: ["Overbooked hour", "Doctor running behind with no update"], code: "L04 open slots · L09 Monday report (busiest hour)" },
  intake:   { name: "Intake & vitals", x: -6, z: -4.4, w: 4.2, d: 3.6, color: 0x86a8ff, mins: "8–10 min",
    what: "Vitals, pain score, medication list, what's changed since last visit.",
    who: "Jovanni", risks: ["Medication list out of date", "Imaging not uploaded yet"], code: "L02 patient cards · L08 filing cabinet" },
  exam:     { name: "Consult / exam room", x: 0, z: -4.4, w: 4.6, d: 3.6, color: 0xbb86ff, mins: "15–30 min",
    what: "Dr. Kim examines, reviews imaging, agrees the plan: therapy, medication, or a procedure.",
    who: "Dr. Kim · Kaiah, FNP-C, APRN", risks: ["Plan needs prior authorization", "Follow-up not booked before the patient leaves"], code: "L03 appointment book" },
  preop:    { name: "Pre-procedure bay", x: 6, z: -4.4, w: 4.2, d: 3.6, color: 0xffd447, mins: "15–20 min",
    what: "The readiness checklist: consent, prior auth, driver if sedated, fasting, blood-thinner plan, site marked.",
    who: "Isis", risks: ["No driver for a sedated case", "Prior auth still pending", "Blood-thinner plan not confirmed"], code: "L13 procedure day (missing items)" },
  proc:     { name: "Procedure room", x: 6, z: 1, w: 4.6, d: 4.4, color: 0x55cddd, mins: "15–60 min + turnover",
    what: "Image-guided injections, nerve blocks, radiofrequency ablation. Room turnover between cases.",
    who: "Dr. Kim, nurse, radiology tech", risks: ["A case not ready blocks the room", "Turnover runs long"], code: "L13 procedure day (room schedule)" },
  recovery: { name: "Recovery", x: 6, z: 6, w: 4.2, d: 3.4, color: 0xff86b4, mins: "15–30 min",
    what: "Observation, discharge instructions, the driver picks up.",
    who: "Nayeli", risks: ["Driver late", "Instructions not given in writing"], code: "L06 reminders (aftercare texts)" },
  checkout: { name: "Checkout & scheduling", x: 0, z: 6, w: 4.2, d: 3.4, color: 0xb3e055, mins: "3–5 min",
    what: "Bill, payment, and the next visit booked before they leave.",
    who: "Sydney · front office", risks: ["Leaving with no follow-up booked", "Balance not explained"], code: "L07 billing · L05 waitlist · L10 front-desk app" },
};
const PATHS = { clinic: ["checkin", "waiting", "intake", "exam", "checkout"], proc: ["checkin", "waiting", "preop", "proc", "recovery", "checkout"] };
let mode = "clinic", step = 0, playing = false;

// ---- scene
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95; stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
camera.position.set(13, 17, 21);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0.8); controls.enableDamping = true; controls.minDistance = 12; controls.maxDistance = 48; controls.maxPolarAngle = Math.PI * 0.46;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8e86b8, 0.55));
const sun = new THREE.DirectionalLight(0xfff1df, 0.95); sun.position.set(-10, 20, 12); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16 }); sun.shadow.radius = 6; scene.add(sun);

// clay: matte, slightly lumpy, hand-made
function clay(color) { return new THREE.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0 }); }
function lumpy(geo, amt = 0.03, seed = 1) {
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = Math.sin(v.x * 3.1 + seed) * Math.cos(v.z * 2.7 + seed * 1.3) * Math.sin(v.y * 4.2 + seed * .7);
    v.multiplyScalar(1 + n * amt); p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals(); return geo;
}
function slab(w, d, h, r, color, seed) {
  const s = new THREE.Shape(), x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + d - r);
  s.quadraticCurveTo(x + w, y + d, x + w - r, y + d); s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: true, bevelThickness: h * .45, bevelSize: Math.min(r * .8, .25), bevelSegments: 5, curveSegments: 10 });
  g.rotateX(-Math.PI / 2); lumpy(g, .012, seed || 1);
  const m = new THREE.Mesh(g, clay(color)); m.castShadow = m.receiveShadow = true; return m;
}
function ball(r, color, seed) { const m = new THREE.Mesh(lumpy(new THREE.SphereGeometry(r, 28, 20), .04, seed || 2), clay(color)); m.castShadow = true; return m; }
function pill(r, h, color) { const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, h, 8, 16), clay(color)); m.castShadow = true; return m; }

// the table the model sits on
const table = slab(26, 22, .5, 1.6, 0xe6d6c3, 3); table.position.y = -.9; scene.add(table);
// corridor
const hall = slab(9, 17.6, .12, .6, 0xd6cdee, 5); hall.position.set(0, -.25, .8); scene.add(hall);
const pick = [];
const roomMeshes = {};
for (const [id, r] of Object.entries(ROOMS)) {
  const g = new THREE.Group(); g.position.set(r.x, 0, r.z);
  const floor = slab(r.w, r.d, .22, .55, r.color, r.x + r.z); floor.position.y = -.2; floor.userData.room = id; g.add(floor); pick.push(floor);
  // low clay walls on the back edge, like a dollhouse
  const wall = slab(r.w, .32, .8, .14, new THREE.Color(r.color).offsetHSL(0, 0, -.12).getHex(), r.z);
  wall.rotation.x = Math.PI / 2; wall.position.set(0, .35, -r.d / 2 + .05); g.add(wall);
  roomMeshes[id] = { group: g, floor }; scene.add(g);
}
// props
function add(id, mesh, x, y, z) { mesh.position.set(x, y, z); roomMeshes[id].group.add(mesh); return mesh; }
add("checkin", slab(2.4, .8, .7, .2, 0xffffff, 7), 0, 0, -.6);
add("checkin", ball(.12, 0x7bd389), .8, .9, -.6);
for (let i = 0; i < 6; i++) add("waiting", slab(.7, .7, .35, .2, [0xff9fb2, 0x9fd3ff, 0xffd59f][i % 3], i), -1.2 + (i % 3) * 1.2, 0, i < 3 ? -.9 : .7);
add("waiting", ball(.45, 0x6cc48a, 9), 1.6, .25, -1.5);
add("intake", slab(.9, .9, .9, .25, 0xffffff, 4), -1, 0, -.4);
add("intake", pill(.12, .9, 0x8a92a8), .9, .55, -.6);
add("exam", slab(2.4, .9, .55, .25, 0xffffff, 6), 0, 0, -.3);
add("exam", slab(.9, .6, .25, .18, 0xb9a6ff, 8), -1.2, .45, -.3);
add("preop", slab(2.2, .9, .5, .25, 0xffffff, 10), 0, 0, -.2);
const clip = add("preop", slab(.6, .8, .08, .08, 0xffa95e, 11), 1.4, .6, .9); clip.rotation.y = .4;
add("proc", slab(2.6, .9, .55, .25, 0xffffff, 12), 0, 0, 0);
const carm = new THREE.Mesh(new THREE.TorusGeometry(1.1, .16, 14, 40, Math.PI * 1.15), clay(0xf6f6fb)); carm.castShadow = true;
carm.rotation.set(0, Math.PI / 2, Math.PI * .92); add("proc", carm, 0, 1.25, 0);
add("proc", pill(.18, 1.1, 0xd7d9e6), 0, .7, -1.5);
for (let i = 0; i < 2; i++) add("recovery", slab(1.3, .8, .45, .3, 0xfff6fa, 13 + i), -1 + i * 2, 0, -.2);
add("checkout", slab(2.4, .8, .7, .2, 0xffffff, 15), 0, 0, -.6);
add("checkout", slab(.5, .35, .25, .08, 0x5d5fe0, 16), .7, .75, -.6);
// the team: little clay cats in scrubs. Front office blue, mid-level maroon, Dr. Kim navy.
const SCRUB = { front: 0x4f8fe6, mid: 0x7a1f35, doc: 0x0f1838, care: 0x7fcf9f };
function nameTag(text, sub) {
  const c = document.createElement("canvas"); c.width = 512; c.height = sub ? 170 : 120; const x = c.getContext("2d");
  x.fillStyle = "#ffffffee"; x.beginPath(); x.roundRect(6, 6, 500, c.height - 12, 40); x.fill();
  x.fillStyle = "#2b2f3a"; x.textAlign = "center"; x.font = "700 64px Nunito, system-ui, sans-serif"; x.fillText(text, 256, sub ? 78 : 82);
  if (sub) { x.fillStyle = "#626a7c"; x.font = "600 40px Nunito, system-ui, sans-serif"; x.fillText(sub, 256, 135); }
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true, toneMapped: false })); s.renderOrder = 10;
  s.scale.set(2.3, 2.3 * c.height / 512, 1); s.position.y = 2.35; return s;
}
function cat(fur, scrubs, { name, sub, ear = fur, big = 1 } = {}) {
  const g = new THREE.Group();
  const b = pill(.33, .42, scrubs); b.position.y = .55; g.add(b);                         // scrubs
  const v = new THREE.Mesh(new THREE.ConeGeometry(.16, .2, 3), clay(new THREE.Color(scrubs).offsetHSL(0, 0, .12).getHex())); // V-neck
  v.rotation.set(Math.PI, 0, 0); v.position.set(0, .93, .27); v.scale.z = .35; g.add(v);
  for (const s of [-1, 1]) { const paw = ball(.1, fur, 4 + s); paw.position.set(s * .2, .02, .2); g.add(paw); }
  const h = ball(.33, fur, 3); h.position.y = 1.3; h.scale.set(1.08, .94, 1); g.add(h);       // head
  for (const s of [-1, 1]) {                                                                   // ears
    const e = new THREE.Mesh(new THREE.ConeGeometry(.12, .24, 12), clay(ear)); e.position.set(s * .19, 1.6, 0); e.rotation.z = -s * .35; e.castShadow = true; g.add(e);
    const i = new THREE.Mesh(new THREE.ConeGeometry(.065, .14, 12), clay(fur === 0x1c1c22 ? 0x5a3a48 : 0xffa9b8)); i.position.set(s * .19, 1.58, .05); i.rotation.z = -s * .35; g.add(i);
    const eye = ball(.05, fur === 0x1c1c22 ? 0xd9c24a : 0x222222); eye.position.set(s * .12, 1.34, .29); g.add(eye);
    const cheek = ball(.09, new THREE.Color(fur).offsetHSL(0, 0, .08).getHex()); cheek.position.set(s * .08, 1.2, .27); cheek.scale.set(1, .8, .6); g.add(cheek);
    for (const k of [-1, 1]) { const w = new THREE.Mesh(new THREE.CylinderGeometry(.008, .008, .3, 4), clay(fur === 0x1c1c22 ? 0xe8e8f0 : 0x3a3a44));
      w.rotation.z = Math.PI / 2 + k * .15 * s; w.position.set(s * .27, 1.2 + k * .03, .25); g.add(w); }
  }
  const nose = ball(.035, 0xff7f98); nose.position.set(0, 1.25, .34); g.add(nose);
  const tail = new THREE.Mesh(new THREE.TorusGeometry(.32, .07, 10, 24, Math.PI * 1.1), clay(fur)); tail.castShadow = true;
  tail.rotation.set(0, Math.PI / 2, -.3); tail.position.set(0, .45, -.42); g.add(tail);
  g.scale.setScalar(big);
  if (name) { const tag = nameTag(name, sub); tag.scale.multiplyScalar(1 / big); g.add(tag); }
  return g;
}
const team = [
  ["checkin", cat(0xf3dcc0, SCRUB.front, { name: "Monica", sub: "Front office" }), .2, -1.4],
  ["checkout", cat(0x9aa1ad, SCRUB.front, { name: "Sydney", sub: "Front office" }), .2, -1.4],
  ["exam", cat(0xc58b5a, SCRUB.mid, { name: "Kaiah", sub: "FNP-C, APRN", ear: 0x3b2a22 }), 1.4, .7],
  ["intake", cat(0x8c7660, SCRUB.care, { name: "Jovanni", big: 1.1 }), .9, .6],
  ["preop", cat(0x1c1c22, SCRUB.care, { name: "Isis" }), -1.3, .9],
  ["recovery", cat(0xf08a2c, SCRUB.care, { name: "Nayeli", ear: 0xd96f12 }), 1.4, 1.0],
];
for (const [id, c, x, z] of team) add(id, c, x, -.1, z);
// Dr. Kim: navy scrubs, stethoscope around the neck
const drKim = cat(0xf7f3ec, SCRUB.doc, { name: "Dr. Kim", sub: "Pain medicine", big: 1.1 });
const sMat = clay(0x23252b);
const curve = new THREE.CatmullRomCurve3([[-.22, .74, .27], [-.27, .95, .04], [-.14, .97, -.22], [.14, .97, -.22], [.27, .95, .04], [.24, .76, .26], [.1, .58, .35], [.02, .47, .37]].map(q => new THREE.Vector3(...q)));
const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 60, .03, 10), sMat); tube.castShadow = true; drKim.add(tube);   // draped around the neck
const ends = new THREE.Mesh(new THREE.CylinderGeometry(.022, .022, .14, 8), clay(0xc9ced8)); ends.position.set(-.22, .68, .28); drKim.add(ends);
const tip = ball(.04, 0x23252b); tip.position.set(-.22, .6, .28); drKim.add(tip);
const bell = new THREE.Mesh(new THREE.CylinderGeometry(.095, .095, .05, 24), clay(0xc9ced8)); bell.rotation.x = Math.PI / 2 - .2; bell.position.set(.02, .42, .39); drKim.add(bell);
scene.add(drKim);
// the patient: a cream clay cat with a yellow scarf
const patient = cat(0xfff1dc, 0xff8fab);
const scarf = new THREE.Mesh(new THREE.TorusGeometry(.3, .08, 10, 24), clay(0xffd166)); scarf.rotation.x = Math.PI / 2; scarf.position.y = 1.0; patient.add(scarf);
scene.add(patient);
// path dots between stations
const dots = new THREE.Group(); scene.add(dots);
function spot(id) { const r = ROOMS[id]; return new THREE.Vector3(r.x + (r.x < 0 ? 1.1 : r.x > 0 ? -1.1 : 1.3), -.1, r.z + .55); }
function drawPath() {
  dots.clear(); const ids = PATHS[mode];
  for (let i = 0; i < ids.length - 1; i++) {
    const a = spot(ids[i]), b = spot(ids[i + 1]);
    for (let t = .15; t < .9; t += .14) { const d = ball(.08, 0x6f5bd3, i + t); d.position.lerpVectors(a, b, t); d.position.y = -.05; dots.add(d); }
  }
  const docRoom = mode === "clinic" ? "exam" : "proc"; const r = ROOMS[docRoom];
  drKim.position.set(r.x - 1.3, -.1, r.z - .2); drKim.rotation.y = .5;
}

// ---- UI
const rail = document.getElementById("rail"), card = document.getElementById("card");
function renderRail() {
  rail.innerHTML = PATHS[mode].map((id, i) => `<button type="button" data-i="${i}" ${i === step ? 'aria-current="step"' : ""}><span class="n">${i + 1}</span>${ROOMS[id].name}</button>`).join("");
  rail.querySelectorAll("button").forEach(b => b.addEventListener("click", () => go(+b.dataset.i)));
}
function renderCard(id) {
  const r = ROOMS[id];
  card.innerHTML = `<span class="k">${mode === "clinic" ? "Clinic day" : "Procedure day"}${PATHS[mode].includes(id) ? ` · step ${PATHS[mode].indexOf(id) + 1} of ${PATHS[mode].length}` : " · not on this path"}</span>
    <h2>${r.name}</h2><p>${r.what}</p>
    <div class="meta"><span class="chip">${r.who}</span><span class="chip est">${r.mins}</span></div>
    <div><span class="k">What goes wrong</span><ul class="risk">${r.risks.map(x => `<li>${x}</li>`).join("")}</ul></div>
    <div><span class="k">Your code for it</span><div class="code">Clinic Quest ${r.code}</div></div>`;
  for (const [k, m] of Object.entries(roomMeshes)) m.floor.material.emissive.setHex(k === id ? 0x2a1f66 : 0x000000);

let from = new THREE.Vector3(), to = new THREE.Vector3(), t0 = 0, moving = false;

}
function setMode(m) {
  mode = m; document.getElementById("m-clinic").setAttribute("aria-pressed", m === "clinic"); document.getElementById("m-proc").setAttribute("aria-pressed", m === "proc");
  stop(); drawPath(); go(0, false);

let timer = null;
function stop() { playing = false; clearInterval(timer); document.getElementById("play").textContent = "▶ Play the visit"; }
document.getElementById("play").addEventListener("click", () => {
  if (playing) return stop();
  playing = true; document.getElementById("play").textContent = "❚❚ Pause";
  if (step >= PATHS[mode].length - 1) go(0, false);
  timer = setInterval(() => { if (step >= PATHS[mode].length - 1) return stop(); go(step + 1); }, 2600);
});
document.getElementById("m-clinic").addEventListener("click", () => setMode("clinic"));
document.getElementById("m-proc").addEventListener("click", () => setMode("proc"));
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const b = renderer.domElement.getBoundingClientRect(); ptr.set(((e.clientX - b.left) / b.width) * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1);
  ray.setFromCamera(ptr, camera); const hit = ray.intersectObjects(pick)[0];
  if (hit) { const id = hit.object.userData.room; const i = PATHS[mode].indexOf(id); if (i >= 0) go(i); else renderCard(id); }
});

// ---- loop
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; const narrow = w < 640; controls.target.set(0, 0, narrow ? 3.2 : .8); camera.position.copy(controls.target).add(new THREE.Vector3(13, 17, 21).setLength(narrow ? 54 : 34)); camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
setMode("clinic");
function frame(now) {
  if (moving) {
    const k = Math.min(1, (now - t0) / (reduce ? 1 : 1100)), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    patient.position.lerpVectors(from, to, e); patient.position.y = -.1 + Math.abs(Math.sin(e * Math.PI * 3)) * .35 * (1 - k);
    const sq = 1 + Math.sin(e * Math.PI * 6) * .06 * (1 - k); patient.scale.set(1 / sq, sq, 1 / sq);
    const dir = to.clone().sub(from); if (dir.lengthSq() > .01) patient.rotation.y = Math.atan2(dir.x, dir.z);

}
requestAnimationFrame(frame);
</script>
