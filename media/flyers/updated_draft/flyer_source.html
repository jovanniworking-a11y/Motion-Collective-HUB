<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "Bodoni Moda"; src: url("../deck/fonts/fontsource-variable-bodoni-moda-5.1.0/package/files/bodoni-moda-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }
@font-face { font-family: "Bodoni Moda"; src: url("../deck/fonts/fontsource-variable-bodoni-moda-5.1.0/package/files/bodoni-moda-latin-wght-italic.woff2") format("woff2"); font-style: italic; font-weight: 400 900; }
@font-face { font-family: "Jost"; src: url("../deck/fonts/fontsource-variable-jost-5.1.0/package/files/jost-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
/* sizes in units of --u so one layout scales to print / feed / story */
:root { --ink:#f2efe8; --dim:#7d7a76; --dim2:#6f6c68; --red:#9b2c34; --m1:#3f1a1e; --m2:#5e2128; --m3:#86313a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #050505; }
.f { width: var(--W); height: var(--H); position: relative; background: #050505; color: var(--ink); font-family: "Bodoni Moda", serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
.mark { position: absolute; left: calc(var(--u)*3.8); top: calc(var(--u)*3.3); font-size: calc(var(--u)*1.9); line-height: 1; display: flex; }
.mark span { margin-right: -.08em; } .mark span:nth-child(1){color:var(--m1)} .mark span:nth-child(2){color:var(--m2)} .mark span:nth-child(3){color:var(--m3)} .mark span:nth-child(4){color:var(--ink)}
.motion { margin-top: var(--top); font-size: calc(var(--u)*2.15); letter-spacing: .62em; padding-left: .62em; }
.eyes { margin-top: var(--gapEyes); width: var(--eyeW); aspect-ratio: 1080 / 1350; background: url("eyes_hc.png") center / cover no-repeat; flex: none; }
.rline { width: 1px; height: calc(var(--u)*4.4); background: var(--red); margin-top: var(--gapLine); }
.title { margin-top: calc(var(--u)*2.6); font-size: calc(var(--u)*2.75); letter-spacing: .34em; padding-left: .34em; white-space: nowrap; }
.sub { margin-top: calc(var(--u)*1.1); font-size: calc(var(--u)*1.12); letter-spacing: .3em; padding-left: .3em; color: #b9b5ae; }
.lineup { margin-top: var(--gapLine2); display: grid; justify-items: center; gap: calc(var(--u)*.7); text-align: center; }
.lineup .hl { font-size: calc(var(--u)*2.2); letter-spacing: .26em; padding-left: .26em; }
.lineup .cr { font-style: italic; font-size: calc(var(--u)*1.25); color: #b9b5ae; letter-spacing: .04em; margin-top: calc(var(--u)*-.25); }
.lineup .sep { width: calc(var(--u)*2.2); height: 1px; background: #3a3836; margin: calc(var(--u)*.6) 0; }
.lineup .op { font-size: calc(var(--u)*1.45); letter-spacing: .24em; padding-left: .24em; }
.lineup .b3 { font-size: calc(var(--u)*1.12); letter-spacing: .3em; padding-left: .3em; color: #c8333c; font-weight: 500; font-family: "Jost", sans-serif; }
.lineup .b3 b { font-family: "Bodoni Moda", serif; font-weight: 400; color: var(--ink); font-size: calc(var(--u)*1.45); letter-spacing: .24em; margin-left: .5em; }
.lineup .t { font-family: "Jost", sans-serif; font-size: calc(var(--u)*.82); letter-spacing: .3em; color: var(--dim); display: block; margin-bottom: calc(var(--u)*.25); }
.notes { margin-top: var(--gapNotes); font-family: "Jost", sans-serif; font-size: calc(var(--u)*.78); letter-spacing: .34em; padding-left: .34em; color: var(--dim2); text-transform: uppercase; }
.foot { position: absolute; bottom: var(--bot); font-family: "Bodoni Moda"; font-size: calc(var(--u)*1.0); letter-spacing: .32em; padding-left: .32em; color: #cfcbc3; white-space: nowrap; }
.rec { position: absolute; bottom: calc(var(--bot) + var(--u)*2.6); font-family: "Jost", sans-serif; font-size: calc(var(--u)*.78); letter-spacing: .34em; padding-left: .34em; color: #b9b5ae; white-space: nowrap; font-weight: 500; }
.rec b { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: #c8333c; margin-right: .8em; vertical-align: .05em; }
.foot i { font-style: normal; color: var(--dim); padding: 0 .6em; }
/* formats */
.print { --W: 1000px; --H: 1400px; --u: 10px; --top: 55px; --gapEyes: 52px; --eyeW: 584px; --gapLine: 40px; --gapLine2: 40px; --gapNotes: 40px; --bot: 58px; }
.feed  { --W: 1080px; --H: 1350px; --u: 10px; --top: 46px; --gapEyes: 34px; --eyeW: 500px; --gapLine: 26px; --gapLine2: 30px; --gapNotes: 30px; --bot: 46px; }
.story { --W: 1080px; --H: 1920px; --u: 12px; --top: 190px; --gapEyes: 64px; --eyeW: 680px; --gapLine: 44px; --gapLine2: 48px; --gapNotes: 46px; --bot: 210px; }
.story .mark { top: 190px; }
</style></head><body>
<div class="f" id="f">
  <div class="mark"><span>M</span><span>M</span><span>M</span><span>M</span></div>
  <div class="motion">MOTION</div>
  <div class="eyes" role="img" aria-label="Three stacked strips of eyes, pupils growing to full white"></div>
  <div class="rline"></div>
  <div class="title">DEVIL’S NIGHT</div>
  <div class="sub">AFTERIMAGE 001</div>
  <div class="lineup">
    <div><span class="t" data-time>12:15 AM</span><div class="hl">HE//THEY</div></div>
    <div class="cr">co.b <span style="color:#c8333c">b2b</span> NiiON</div>
    <div class="sep"></div>
    <div><span class="t" data-time>11 PM</span><div class="op">GLAMZ</div></div>
    <div class="sep"></div>
    <div><span class="t" data-time>9 PM</span><div class="op">IAMARIOLOGY <span style="color:#c8333c;font-size:.78em;letter-spacing:.3em;font-family:Jost,sans-serif;font-weight:500">B2B</span> RAYMIXES</div></div>
  </div>
  <div class="notes">Costumes encouraged · best look wins $40 · invite only</div>
  <div class="rec"><b></b>OFFICIAL RECORDING ON SITE · PHONES AWAY</div>
  <div class="foot">10.30.26<i>·</i>9 PM<i>·</i>AUSTIN<i>·</i>LIMITED DRINKS<i>·</i>BYOB</div>
</div>
<script>
const q=new URLSearchParams(location.search); document.getElementById('f').classList.add(q.get('fmt')||'print');
if(q.get('times')!=='1') document.querySelectorAll('[data-time]').forEach(e=>e.remove());
</script></body></html>
