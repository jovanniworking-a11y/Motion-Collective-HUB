<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "Bodoni Moda"; src: url("../deck/fonts/fontsource-variable-bodoni-moda-5.1.0/package/files/bodoni-moda-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }

html, body { background: transparent; width: 1080px; height: 1920px; overflow: hidden; }

<div class="c" id="c"></div>

if(v==='name'){ c.className='c lt'; c.innerHTML='<div class="k">OPENING DEVIL’S NIGHT</div><div class="n">IAMARIOLOGY<br><small>B2B</small><br>RAYMIXES</div>'; }
